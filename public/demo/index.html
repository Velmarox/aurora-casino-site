<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client demos — Merwin Web Designz</title>

<!-- ============================================================================
     CLIENT DEMO PORTAL

     READ THIS BEFORE YOU TELL A CLIENT THEIR DEMO IS PRIVATE.

     This is a curtain, not a lock. The demos are ordinary files on a static
     host: anyone who types /demo/aurora reaches it whether they came through
     this page or not. The access code hides the LINK, not the destination.

     What it does buy you:
       - nobody stumbles in from your homepage
       - the codes are hashed, so view-source does not hand them over
       - every demo carries <meta robots="noindex">, so Google never lists them

     What it does not buy you: real access control. If a demo ever needs to hold
     something genuinely confidential, it has to be served through authenticated
     code rather than sat in a public folder.

     TO ADD A CLIENT
       1. Pick a code. Something typeable - clients copy these out of email.
       2. Hash it:   node -e "console.log(require('crypto').createHash('sha256').update('YourCodeHere').digest('hex'))"
       3. Add the hash and their folder name to CLIENTS below.
       4. Put their demo in /demo/<foldername>/
     ========================================================================= -->

<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:#0e0e11;color:#f2f2f0;
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:420px;background:#17171b;border:1px solid #2b2b33;
    border-radius:4px;padding:36px 32px;box-shadow:0 24px 60px -30px #000}
  h1{margin:0 0 10px;font-size:23px;letter-spacing:-.02em}
  .lead{margin:0 0 6px;color:#b9b9b4}
  .blunt{margin:0 0 26px;color:#6f6f78;font-size:14.5px}
  label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:#b9b9b4;margin-bottom:7px}
  input{width:100%;font:16px/1.4 inherit;color:#f2f2f0;background:#0e0e11;
    border:1px solid #3a3a44;border-radius:3px;padding:13px 14px;min-height:50px}
  input:focus-visible{outline:2px solid #5b8cff;outline-offset:2px;border-color:#5b8cff}
  button{width:100%;margin-top:16px;font:700 14px/1 inherit;letter-spacing:.07em;
    text-transform:uppercase;color:#0e0e11;background:#f2f2f0;border:0;
    border-radius:3px;min-height:50px;cursor:pointer}
  button:hover{background:#fff}
  button[disabled]{opacity:.55;cursor:wait}
  .err{margin:16px 0 0;padding:12px 14px;border-radius:3px;font-size:14px;font-weight:600;
    background:rgba(255,84,104,.12);border:1px solid #ff5468;color:#ff8d9b}
  .foot{margin:26px 0 0;padding-top:20px;border-top:1px solid #2b2b33;
    font-size:13.5px;color:#6f6f78}
  .foot a{color:#b9b9b4}
</style>
</head>
<body>

<main class="card">
  <h1>Client demos</h1>
  <p class="lead">Enter the access code from your email.</p>
  <p class="blunt">If you don't know what this is, you're in the wrong place.</p>

  <form id="gate" novalidate>
    <label for="code">Access code</label>
    <input id="code" name="code" type="password" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="go">View demo</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>

  <p class="foot">Codes go out by email when a demo is ready.
    Lost yours? <a href="/">Get in touch</a>.</p>
</main>

<script>
(function () {
  'use strict';

  /* sha256 hash -> folder under /demo/. Plain codes never appear in this file. */
  var CLIENTS = {
    '6db99744a1517adf6888025a2724cc4fd4455d549f2e3caee8d1f23ee498b884': 'aurora'
  };

  var form = document.getElementById('gate');
  var input = document.getElementById('code');
  var btn = document.getElementById('go');
  var err = document.getElementById('err');

  function fail(msg) {
    err.textContent = msg;
    err.hidden = false;
    btn.disabled = false;
    input.select();
  }

  async function sha256(text) {
    var bytes = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(buf))
      .map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.hidden = true;

    var code = input.value.trim();
    if (!code) { fail('Enter your access code.'); return; }

    /* crypto.subtle only exists over https and on localhost. If someone opens
       this file straight off a disk it would throw, so say something useful
       rather than failing silently. */
    if (!(window.crypto && crypto.subtle)) {
      fail('This page needs a secure connection. Open it over https.');
      return;
    }

    btn.disabled = true;
    var hash;
    try { hash = await sha256(code); }
    catch (ex) { fail('Something went wrong. Refresh and try again.'); return; }

    var folder = CLIENTS[hash];
    if (!folder) {
      /* A beat before the rejection. Not security - the codes are in the page
         and anyone determined reads them - but it stops idle guessing from
         feeling like a game. */
      setTimeout(function () {
        fail('That code is not right. Check the email it came in, or get in touch.');
      }, 600);
      return;
    }

    location.href = './' + folder + '/';
  });
})();
</script>
</body>
</html>
